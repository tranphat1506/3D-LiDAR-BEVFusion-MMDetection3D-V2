name: Bug Report
description: Create a report to help us improve the project
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us diagnose and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem encountered during setup, inference, or visualization.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps to reproduce the behavior.
      placeholder: |
        1. Set up environment according to README.md
        2. Run command: 'python setup_demo.py'
        3. Encounter error at step ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: Describe what should happen when following the steps above.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened when running the command.
      placeholder: Describe the error, failure, or unintended output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: |
        Please fill in your environment details. Accurate version details are critical for debugging CUDA and OpenMMLab dependencies.
      value: |
        - Operating System: [e.g., Ubuntu 22.04 LTS, Windows 11, Google Colab]
        - Python version: [e.g., 3.10.22]
        - PyTorch version: [e.g., 2.1.2+cu118]
        - CUDA version: [e.g., 11.8 (nvcc)]
        - NVIDIA GPU model: [e.g., Tesla T4, RTX 3090, CPU-only]
        - MMDetection3D version: [e.g., 1.4.0 (dev-1.x branch)]
        - MMCV version: [e.g., 2.1.0]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Messages
      description: Paste relevant terminal output, Python tracebacks, or warning logs here.
      render: shell
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: Additional Context and Attachments
      description: Add any other context, relevant file paths, or drag and drop screenshots here.
    validations:
      required: false
